# docker-compose.dev.yml (Dev : https://dev.beatboxgames.com, branche dev)
#
# Même architecture que la production, avec ses propres conteneurs, sa propre
# base de données (volume beatbox-data-dev) et ses propres secrets
# (/etc/beatbox-games/.env.dev). Se déploie depuis le clone de travail du VPS,
# sur la branche dev : ./deploy.sh dev
services:
  server-dev:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: beatbox-games-dev-server
    expose:
      - "4000"
    volumes:
      - ./server/public:/app/public
      - beatbox-data-dev:/app/data
      - ./server/beatbox_artists:/app/beatbox_artists
    env_file:
      - /etc/beatbox-games/.env.dev
    environment:
      # Node en mode production (comme la prod), configuration « staging » du serveur :
      # adresses dev.beatboxgames.com, journaux détaillés
      - NODE_ENV=production
      - STAGING=true
      - BASE_URL=https://dev.beatboxgames.com
      - CLIENT_URL=https://dev.beatboxgames.com
      # Le vrai Google Sheet n'est modifié que par la production
      - SHEET_SYNC=false
      # Site réservé aux comptes de la liste d'accès (admin > Accès testeurs) et aux admins
      - ACCESS_GATE=true
      - DISABLE_CONSOLE=false
      - LOG_LEVEL=DEBUG
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    networks:
      - shared-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  client-dev:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
        - REACT_APP_ENV=staging
        - REACT_APP_API_URL=https://dev.beatboxgames.com
        - GENERATE_SOURCEMAP=true
        # Écran de connexion obligatoire (client/src/components/AccessGate.jsx)
        - REACT_APP_ACCESS_GATE=true
    container_name: beatbox-games-dev-client
    environment:
      # Lus par le modèle client/nginx/default.conf.template (hors production : fermé aux moteurs)
      - APP_ENV=development
      - SERVER_UPSTREAM=beatbox-games-dev-server:4000
    expose:
      - "80"
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      - server-dev
    networks:
      - shared-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"

# Le réseau de la production, déjà relié à Nginx Proxy Manager : la prod doit tourner.
# L'autoheal de la production (AUTOHEAL_CONTAINER_LABEL=all) surveille aussi ces conteneurs.
networks:
  shared-network:
    name: shared-network
    external: true

volumes:
  beatbox-data-dev:
    name: beatbox-data-dev
    external: true
