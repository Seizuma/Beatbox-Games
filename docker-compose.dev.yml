# docker-compose.dev.yml
services:
  server-dev:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: beatbox-games-dev-server
    ports:
      - "4001:4000"
    volumes:
      - ./server/public:/app/public
      - /app/node_modules
      - beatbox-data-dev:/app/data
      - ./server/beatbox_artists:/app/beatbox_artists
    env_file:
      - .env.dev
    environment:
      - NODE_ENV=development
      - DEV=true
      - BASE_URL=https://dev.beatboxgames.com
      - CLIENT_URL=https://dev.beatboxgames.com
      - DISABLE_CONSOLE=false
      - LOG_LEVEL=DEBUG
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    networks:
      - dev-network
      - proxy-network
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  client-dev:
    build:
      context: ./client
      dockerfile: Dockerfile.staging
      args:
        - NODE_ENV=development
        - REACT_APP_ENV=development
        - REACT_APP_API_URL=https://dev.beatboxgames.com
        - GENERATE_SOURCEMAP=true
    container_name: beatbox-games-dev-client
    ports:
      - "8081:80"
    volumes:
      - ./client/src:/app/src
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      - server-dev
    networks:
      - dev-network
      - proxy-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "2"

  autoheal-dev:
    image: willfarrell/autoheal:latest
    container_name: beatbox-games-dev-autoheal
    environment:
      - AUTOHEAL_CONTAINER_LABEL=dev
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - dev-network
      - proxy-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "1"

networks:
  dev-network:
    name: beatbox-games-dev-network
    driver: bridge
  proxy-network:
    external: true

volumes:
  beatbox-data-dev:
    name: beatbox-data-dev
    external: true
