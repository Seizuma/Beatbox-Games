name: 🔄 Sync preprod → develop

on:
  push:
    branches:
      - preprod

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # important pour pouvoir merge
          persist-credentials: false

      - name: Setup Git user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout develop branch
        run: |
          git checkout develop

      - name: Merge preprod into develop
        run: |
          git merge origin/preprod --no-edit || echo "⚠️ Merge conflict detected, manual intervention required"

      - name: Push changes to develop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} HEAD:develop
